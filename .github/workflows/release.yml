name: Release

# Cut a tag, get signed APKs and a draft release to check before publishing.
# See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  # Useful as a dry run: builds and signs, uploads the APKs as run artifacts,
  # and stops short of touching the Releases page.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and draft
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Fail in the first ten seconds rather than four minutes later holding two
      # APKs named "-unsigned" that would otherwise get attached to a release.
      - name: Check the signing secrets are present
        env:
          POCKETPRINT_KEYSTORE_BASE64: ${{ secrets.POCKETPRINT_KEYSTORE_BASE64 }}
          POCKETPRINT_KEYSTORE_PASSWORD: ${{ secrets.POCKETPRINT_KEYSTORE_PASSWORD }}
          POCKETPRINT_KEY_ALIAS: ${{ secrets.POCKETPRINT_KEY_ALIAS }}
          POCKETPRINT_KEY_PASSWORD: ${{ secrets.POCKETPRINT_KEY_PASSWORD }}
        run: |
          missing=0
          for name in POCKETPRINT_KEYSTORE_BASE64 POCKETPRINT_KEYSTORE_PASSWORD \
                      POCKETPRINT_KEY_ALIAS POCKETPRINT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See docs/RELEASING.md for how to create the key and set the secrets." >&2
            exit 1
          fi

      - name: Decode the signing key
        env:
          POCKETPRINT_KEYSTORE_BASE64: ${{ secrets.POCKETPRINT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$POCKETPRINT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocketprint.jks"
          test -s "$RUNNER_TEMP/pocketprint.jks" ||
            { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same gate main gets. A release is the worst place to find out that
      # a test was failing.
      - name: Unit tests (both variants)
        run: ./gradlew testLegacyDebugUnitTest testModernDebugUnitTest --no-daemon

      - name: Assemble signed release APKs
        env:
          POCKETPRINT_KEYSTORE: ${{ runner.temp }}/pocketprint.jks
          POCKETPRINT_KEYSTORE_PASSWORD: ${{ secrets.POCKETPRINT_KEYSTORE_PASSWORD }}
          POCKETPRINT_KEY_ALIAS: ${{ secrets.POCKETPRINT_KEY_ALIAS }}
          POCKETPRINT_KEY_PASSWORD: ${{ secrets.POCKETPRINT_KEY_PASSWORD }}
        run: ./gradlew assembleLegacyRelease assembleModernRelease --no-daemon

      - name: Collect and name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/modern/release/app-modern-release.apk \
             dist/pocketprint-modern.apk
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk \
             dist/pocketprint-legacy.apk

      # An APK the package manager will refuse to install is not a release.
      - name: No required hardware features
        run: ./scripts/check-required-features.sh dist/pocketprint-modern.apk dist/pocketprint-legacy.apk

      # Prints the signing certificate into the log, which is how anyone can
      # check that a published APK carries the key they expect. The certificate
      # is public by definition; the key it came from never leaves the secret.
      #
      # "Verified using v1 scheme: false" here is expected and not a problem.
      # The JAR signature is present - both flavours enable it - but apksigner
      # only exercises the schemes needed at the APK's own minSdk, and from
      # API 24 v2 is enough. Pass --min-sdk-version 21 to see v1 verify.
      - name: Verify the signatures and record the certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" |
              tee "$RUNNER_TEMP/$(basename "$apk").certs"
          done

          # The release notes tell people to check their download against this
          # fingerprint, so it is read back from the signed APKs rather than
          # written down anywhere. Hardcoding it would mean the notes keep
          # vouching for the old key on the day the signing key changes, which
          # is the one day anybody reads them.
          digests() {
            grep -h "certificate $1 digest:" "$RUNNER_TEMP"/*.certs |
              awk '{ print $NF }' | sort -u
          }
          cert_sha256="$(digests SHA-256)"
          cert_sha1="$(digests SHA-1)"

          # One certificate, or the notes would vouch for a key that signed
          # only half the release.
          if [ -z "$cert_sha256" ] ||
             [ "$(printf '%s\n' "$cert_sha256" | wc -l)" -ne 1 ]; then
            echo "::error::Expected one signing certificate across the APKs, found:" >&2
            printf '%s\n' "$cert_sha256" >&2
            exit 1
          fi

          echo "Signing certificate SHA-256: $cert_sha256"
          {
            echo "CERT_SHA256=$cert_sha256"
            echo "CERT_SHA1=$cert_sha1"
          } >> "$GITHUB_ENV"

      - name: Checksums
        run: |
          cd dist
          sha256sum pocketprint-modern.apk pocketprint-legacy.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the APKs as run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: dist/
          if-no-files-found: error

      # Draft, never published. Someone reads the notes and presses the button.
      #
      # Create or attach, not just create. A run that fails after the release
      # has been drafted - a flaky upload, a cancelled job, a release somebody
      # made by hand first - cannot be re-run if this only ever creates, because
      # gh release create refuses when the release already exists. Re-running a
      # failed release is exactly what anybody does next, so it has to work.
      #
      # An existing release keeps its notes. They may have been written by a
      # person, and overwriting somebody's release notes in order to re-attach
      # the same three files would be a poor trade. That is also why the
      # generated notes no longer quote the checksums: SHA256SUMS.txt is
      # attached, it is the thing anyone verifying would actually use, and notes
      # that cannot go stale need no rule about when to refresh them.
      - name: Create or update the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            dist/pocketprint-modern.apk
            dist/pocketprint-legacy.apk
            dist/SHA256SUMS.txt
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME; attaching the builds to it."
            # Worth saying out loud: attaching to a published release makes
            # these files public immediately, with nobody pressing anything.
            gh release view "$GITHUB_REF_NAME" --json isDraft -q 'if .isDraft
              then "It is still a draft, so nothing is public yet."
              else "::warning::That release is already published - these files are now public."
              end'
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi

          {
            echo "## PocketPrint $version"
            echo
            echo "Two builds of identical code. **Use \`modern\` unless your device is older than Android 12.**"
            echo
            echo "| | Android | Location permission |"
            echo "|---|---|---|"
            echo "| \`pocketprint-modern.apk\` | 12+ (API 31) | none |"
            echo "| \`pocketprint-legacy.apk\` | 7.0+ (API 24) | none |"
            echo
            echo "Checksums are in the attached \`SHA256SUMS.txt\`."
            echo
            echo "## Checking what you downloaded"
            echo
            echo "Both APKs carry a single signing certificate:"
            echo
            echo '```'
            echo "SHA-256  $CERT_SHA256"
            echo "SHA-1    $CERT_SHA1"
            echo '```'
            echo
            echo "To confirm a file you have is really this build:"
            echo
            echo '```'
            echo "apksigner verify --print-certs pocketprint-modern.apk"
            echo '```'
            echo
            echo "A different fingerprint means a different key, whatever the" \
                 "filename says - and Android will refuse to install it over" \
                 "this one."
          } > dist/NOTES.md

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "PocketPrint $version" \
            --notes-file dist/NOTES.md \
            "${assets[@]}"

      - name: Shred the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/pocketprint.jks"
