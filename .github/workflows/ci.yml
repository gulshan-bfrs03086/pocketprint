name: CI

on:
  push:
    # Version work happens on release/* before it merges to main, so those
    # branches need the same gate main gets - otherwise a version is only
    # checked at the moment it lands, which is the moment it is too late.
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and check installability
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # AGP requires JDK 17; newer JDKs are not supported by the version pinned
      # in gradle/libs.versions.toml.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (both variants)
        run: ./gradlew testLegacyDebugUnitTest testModernDebugUnitTest --no-daemon

      # assembleRelease also runs lintVitalRelease and R8, which have caught
      # real defects here (an invalid backup-rules path, missing keep rules).
      - name: Assemble both variants, debug and release
        run: >-
          ./gradlew
          assembleLegacyDebug assembleModernDebug
          assembleLegacyRelease assembleModernRelease
          --no-daemon

      # Android refuses to install a package whose required hardware features
      # the device lacks, reporting only "Can't install the app". This has
      # happened for real, so it is a build failure rather than a review item.
      # Runs against every variant. The legacy flavour is the one at risk:
      # it carries ACCESS_FINE_LOCATION, which implies a required location
      # feature unless explicitly declared optional.
      - name: No required hardware features
        run: ./scripts/check-required-features.sh

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/legacy/debug/app-legacy-debug.apk
            app/build/outputs/apk/modern/debug/app-modern-debug.apk
          if-no-files-found: error

      # Only useful when something broke, and the reports are large.
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
