name: CI

on:
  push:
    # Version work happens on release/* before it merges to main, so those
    # branches need the same gate main gets - otherwise a version is only
    # checked at the moment it lands, which is the moment it is too late.
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and check installability
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # AGP requires JDK 17; newer JDKs are not supported by the version pinned
      # in gradle/libs.versions.toml.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The IPP client is exercised against ippeveprinter, the IPP Everywhere
      # reference implementation that ships with CUPS - a real server that
      # validates media, moves jobs through their states and stores exactly the
      # bytes it was sent. Without it those tests report as skipped, which is
      # visible in the report but is not the same as having run, so the install
      # is allowed to fail the build.
      - name: Install the IPP Everywhere reference printer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cups-ipp-utils avahi-daemon
          sudo systemctl start avahi-daemon || true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Those tests skip themselves when ippeveprinter is absent. It was
      # installed above, so a skip here means the server did not start - and
      # a verification that quietly did not happen must not read as a pass.
      # Prints each live test's outcome so the log says what was shown.
      - name: The live IPP tests ran, rather than skipped
        run: |
          report=app/build/test-results/testDebugUnitTest/TEST-com.gulshan.pocketprint.IppEverywhereLiveTest.xml
          test -f "$report" || { echo "::error::no test report for IppEverywhereLiveTest"; exit 1; }
          python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          tests, skipped = int(r.get("tests")), int(r.get("skipped"))
          failed = int(r.get("failures")) + int(r.get("errors"))
          for tc in r.iter("testcase"):
              el = tc.find("skipped")
              state = "SKIPPED" if el is not None else ("FAILED" if tc.find("failure") is not None or tc.find("error") is not None else "passed")
              print(f"  {state:8} {tc.get('name')}")
              if el is not None and el.get("message"):
                  print(f"           {el.get('message')}")
          if tests == 0 or skipped == tests:
              print("::error::every live IPP test skipped: ippeveprinter is installed, so it did not start")
              sys.exit(1)
          if failed:
              sys.exit(1)
          print(f"{tests - skipped} of {tests} live IPP tests ran against ippeveprinter")
          PY

      # assembleRelease also runs lintVitalRelease and R8, which have caught
      # real defects here (an invalid backup-rules path, missing keep rules).
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      # Android refuses to install a package whose required hardware features
      # the device lacks, reporting only "Can't install the app". This has
      # happened for real, so it is a build failure rather than a review item.
      # Runs against every variant. Nothing declares a location permission any
      # more, so nothing should imply a location feature - which is exactly the
      # state worth defending, since the last time one crept in the app became
      # uninstallable on hardware with no GPS.
      - name: No required hardware features
        run: ./scripts/check-required-features.sh

      # What the app asks the user for is a promise, and it is written out in
      # prose in four places that no compiler reads. All four went stale at once
      # after the permissions were cut, and one of them - the release notes
      # table - was caught by hand minutes before it went public.
      - name: Permissions match what is documented
        run: ./scripts/check-permissions.sh

      # One class lives inside the android.print package to reach a
      # package-private constructor, which is unsupported and can stop working
      # on any Android release. This fails if a second one appears, or if the
      # public-API fallback stops being wired in.
      - name: One platform-package exception, with its fallback
        run: ./scripts/check-platform-packages.sh

      # The print framework's job and session handles throw IllegalAccessError
      # off the main thread, and runCatching swallows an Error as readily as an
      # Exception - which is how three separate violations each presented as a
      # print dialog that searched forever. One file may touch those handles;
      # this fails if any other file does, or if that file learns to dispatch.
      - name: Print-framework calls stay on the main thread
        run: ./scripts/check-printservice-threading.sh

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Only useful when something broke, and the reports are large.
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
